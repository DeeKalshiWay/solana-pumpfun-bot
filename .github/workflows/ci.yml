name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - name: ruff check
        run: ruff check .
      # `ruff format --check` intentionally not enforced yet — would
      # require reformatting ~5K LOC of legacy code in one go. Run it
      # locally with `ruff format .` when you're ready to bite that off.

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          # Drop playwright (unused, ~heavy install) and install dev deps.
          grep -v '^playwright' requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt
          pip install mypy types-requests
      - name: mypy
        # Lenient: just catch syntax / import errors at first.
        # Tighten module-by-module via pyproject.toml over time.
        run: mypy --no-incremental . || true
      - name: mypy (enforced subset)
        # These modules MUST type-check cleanly. Add to this list as
        # modules get cleaned up.
        run: mypy --no-incremental tests/

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          grep -v '^playwright' requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt
          pip install pytest pytest-asyncio
      - name: pytest
        run: pytest

  docker-build:
    name: Docker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pump_bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
